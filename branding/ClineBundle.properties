untrustedProjectTitle=NORINCO Code Agent is disabled in this project
untrustedProjectBody=This project was opened in safe (preview) mode, so the IDE does not \
trust it yet. NORINCO Code Agent can run scripts and commands defined inside the project folder \
(for example <code>.clinerules/hooks/</code>), which is not safe for code you have \
not reviewed.<br><br>If you trust the authors of this project, enable NORINCO Code Agent below.
untrustedProjectTrustButton=Trust Project and Enable NORINCO Code Agent

jcefMissing=<p><b>NORINCO Code Agent needs WebView to display its UI</b></p>\
<p>The running IDE was started with a JDK that does not include JCEF (Java Chromium Embedded Framework), which NORINCO Code Agent''s UI requires.</p>\
<p>Go to <b>Help</b> -> <b>Find Action...</b>, type <b>Choose Boot Java Runtime for the IDE</b>, then pick the runtime with <b>"JCEF"</b> in its name whose version matches your current runtime (shown below), and restart the IDE. A runtime newer or older than the one the IDE ships with can prevent the IDE from starting.</p>\
<p>Need more details? Read the full guide: <a href="https://intellij-support.jetbrains.com/hc/en-us/articles/206544879-Selecting-the-JDK-version-the-IDE-will-run-under">Selecting the JDK version the IDE will run under</a></p>\
<p><small><strong>Java Runtime Information:</strong><br>{0}</small></p>

jcefMissingAS=<p><b>NORINCO Code Agent needs WebView to display its UI</b></p>\
<p>Hi! NORINCO Code Agent uses a modern web-based interface that requires JCEF (Java Chromium Embedded Framework). Unfortunately, Android Studio doesn''t include this by default, but we can help you enable it!</p>\
<p><b>To use NORINCO Code Agent in Android Studio:</b></p>\
<ol>\
  <li>Go to <b>Help</b> -> <b>Find Action...</b></li>\
  <li>Type: <b>Choose Boot Java Runtime for the IDE</b></li>\
  <li>Pick the runtime with <b>"JCEF"</b> in its name whose version matches your current runtime (shown in the Java Runtime Information below). A runtime newer or older than the one Android Studio ships with can prevent the IDE from starting.</li>\
  <li>If no matching JCEF runtime is listed, click <b>Download...</b> and choose the JetBrains Runtime <b>with JCEF</b> that matches your current runtime version.</li>\
  <li>Click <b>OK</b> and restart Android Studio</li>\
</ol>\
<p>Once you restart, NORINCO Code Agent will work perfectly with all its features!</p>\
<p><small>If Android Studio fails to start after changing the runtime, delete the <b>studio.jdk</b> file in Android Studio''s configuration directory to revert to the default runtime.</small></p>\
<p>Need more details? Read the full guide: <a href="https://intellij-support.jetbrains.com/hc/en-us/articles/206544879-Selecting-the-JDK-version-the-IDE-will-run-under">Selecting the JDK version the IDE will run under</a></p>\
<p><small><strong>Java Runtime Information:</strong><br>{0}</small></p>

jcefMissingASPlugin=<p><b>NORINCO Code Agent needs WebView to display its UI</b></p>\
<p>NORINCO Code Agent''s UI requires JCEF (Java Chromium Embedded Framework). Android Studio doesn''t include it by default, but JetBrains now provides it as a regular plugin — no runtime changes needed.</p>\
<p>Click the button below to install the <b>Web Browser (JCEF)</b> plugin by JetBrains, then restart Android Studio.</p>\
<p><small>You can also install it manually: <b>Settings</b> -> <b>Plugins</b> -> <b>Marketplace</b>, search for <b>Web Browser (JCEF)</b>.</small></p>\
<p><small><strong>Java Runtime Information:</strong><br>{0}</small></p>

jcefIncompatibleASPlugin=<p><b>NORINCO Code Agent needs WebView to display its UI</b></p>\
<p>Android Studio was started with a custom JCEF runtime whose build <b>doesn''t match this version of Android Studio</b>, so NORINCO Code Agent''s UI can''t start.</p>\
<p>Good news: swapping the runtime is no longer needed — JetBrains now provides JCEF as a regular plugin.</p>\
<ol>\
  <li>Revert to the default runtime: go to <b>Help</b> -> <b>Find Action...</b>, run <b>Choose Boot Java Runtime for the IDE</b> and select the default runtime (or delete the <b>studio.jdk</b> file in Android Studio''s configuration directory).</li>\
  <li>Click the button below to install the <b>Web Browser (JCEF)</b> plugin by JetBrains.</li>\
  <li>Restart Android Studio.</li>\
</ol>\
<p><small><strong>Java Runtime Information:</strong><br>{0}</small></p>

