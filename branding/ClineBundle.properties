jcefRestartLater=Later

mcpIdeServerPromptTitle=Use JetBrains IDE tools in NORINCO Code Agent?
mcpIdeServerPromptMessage=This IDE includes a built-in MCP server that gives NORINCO Code Agent IDE-native tools: \
code navigation, inspections, refactorings, run configurations, and the debugger. \
NORINCO Code Agent can enable it and connect to it automatically. Tool calls still require your approval.
mcpIdeServerConnectButton=Connect
# NOTE: apostrophes are doubled only in strings with {N} params (MessageFormat applies there);
# param-less strings are returned raw, so doubling would render literally.
mcpIdeServerDontAskButton=Don't Ask Again
mcpIdeServerConnectedTitle=IDE tools connected
mcpIdeServerConnectedMessage=The IDE''s built-in MCP server is now available to NORINCO Code Agent as ''{0}''. \
Manage it in NORINCO Code Agent under MCP Servers.
mcpIdeServerAutoConnectedMessage=This IDE''s built-in MCP server is enabled, so NORINCO Code Agent connected \
to it automatically as ''{0}'' — code navigation, inspections, refactorings, run \
configurations, and the debugger. Tool calls still require your approval. Manage or remove it \
in NORINCO Code Agent under MCP Servers.
mcpIdeServerDisconnectButton=Disconnect
mcpIdeServerUntrusted=the project is not trusted yet — NORINCO Code Agent is disabled until you trust it
mcpIdeServerFailedTitle=Could not connect IDE tools
mcpIdeServerFailedMessage=NORINCO Code Agent could not connect to the IDE''s built-in MCP server: {0}

jcefIncompatible=<p><b>NORINCO Code Agent needs WebView to display its UI</b></p>\
<p>The IDE has a JCEF (Java Chromium Embedded Framework) runtime installed, but it''s a build that <b>doesn''t match this version of the IDE</b>, so JCEF fails to start.</p>\
<p>Go to <b>Help</b> -> <b>Find Action...</b>, type <b>Choose Boot Java Runtime for the IDE</b>, then pick the runtime with <b>"JCEF"</b> in its name whose version matches your current runtime (shown below), and restart the IDE. A runtime newer or older than the one the IDE ships with can prevent the IDE from starting.</p>\
<p>Need more details? Read the full guide: <a href="https://intellij-support.jetbrains.com/hc/en-us/articles/206544879-Selecting-the-JDK-version-the-IDE-will-run-under">Selecting the JDK version the IDE will run under</a></p>\
<p><small><strong>Java Runtime Information:</strong><br>{0}</small></p>

jcefIncompatibleAS=<p><b>NORINCO Code Agent needs WebView to display its UI</b></p>\
<p>Android Studio started with a JCEF runtime, but it''s a build that <b>doesn''t match this version of Android Studio</b>, so NORINCO Code Agent''s UI can''t start.</p>\
<p><b>To fix this in Android Studio:</b></p>\
<ol>\
  <li>Go to <b>Help</b> -> <b>Find Action...</b></li>\
  <li>Type: <b>Choose Boot Java Runtime for the IDE</b></li>\
  <li>Pick the runtime with <b>"JCEF"</b> in its name whose version matches your current runtime (shown in the Java Runtime Information below). A runtime newer or older than the one Android Studio ships with can prevent the IDE from starting.</li>\
  <li>Click <b>OK</b> and restart Android Studio</li>\
</ol>\
<p>Once you restart with a matching JCEF runtime, NORINCO Code Agent will work perfectly with all its features!</p>\
<p><small>If Android Studio fails to start after changing the runtime, delete the <b>studio.jdk</b> file in Android Studio''s configuration directory to revert to the default runtime.</small></p>\
<p>Need more details? Read the full guide: <a href="https://intellij-support.jetbrains.com/hc/en-us/articles/206544879-Selecting-the-JDK-version-the-IDE-will-run-under">Selecting the JDK version the IDE will run under</a></p>\
<p><small><strong>Java Runtime Information:</strong><br>{0}</small></p>

