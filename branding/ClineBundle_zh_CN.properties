untrustedProjectTitle=此项目中已禁用NORINCO Code Agent
untrustedProjectBody=此项目以安全（预览）模式打开，因此 IDE 尚未信任它。NORINCO Code Agent可以运行项目文件夹中定义的脚本和命令（例如 <code>.clinerules/hooks/</code>），对未经审核的代码执行这些操作并不安全。<br><br>如果您信任此项目的作者，请在下方信任项目并启用NORINCO Code Agent。
untrustedProjectTrustButton=信任项目并启用NORINCO Code Agent

jcefMissing=<p><b>NORINCO Code Agent需要 WebView 才能显示界面</b></p><p>当前 IDE 使用的 JDK 不包含 JCEF（Java Chromium Embedded Framework）。</p><p>请打开 <b>帮助</b> → <b>查找操作</b>，搜索 <b>为 IDE 选择启动 Java 运行时</b>，选择版本与当前运行时一致且包含 <b>JCEF</b> 的运行时，然后重启 IDE。</p><p><small><strong>Java 运行时信息：</strong><br>{0}</small></p>
jcefMissingAS=<p><b>NORINCO Code Agent需要 WebView 才能显示界面</b></p><p>Android Studio 默认可能不包含 JCEF。请打开 <b>帮助</b> → <b>查找操作</b>，搜索 <b>为 IDE 选择启动 Java 运行时</b>，选择匹配当前版本且包含 JCEF 的运行时，然后重启。</p><p><small><strong>Java 运行时信息：</strong><br>{0}</small></p>
jcefMissingASPlugin=<p><b>NORINCO Code Agent需要 WebView 才能显示界面</b></p><p>请安装 JetBrains 的 <b>Web Browser (JCEF)</b> 插件，然后重启 Android Studio。</p><p><small><strong>Java 运行时信息：</strong><br>{0}</small></p>
jcefIncompatibleASPlugin=<p><b>NORINCO Code Agent需要 WebView 才能显示界面</b></p><p>当前 JCEF 运行时与 Android Studio 版本不匹配。请恢复默认运行时，安装 JetBrains 的 <b>Web Browser (JCEF)</b> 插件，然后重启。</p><p><small><strong>Java 运行时信息：</strong><br>{0}</small></p>
jcefInstallPluginButton=安装 Web Browser (JCEF) 插件
jcefRestartTitle=重启 Android Studio
jcefRestartMessage=Web Browser (JCEF) 插件已安装。请重启 Android Studio 以启用NORINCO Code Agent界面。
jcefRestartNow=立即重启
jcefRestartLater=稍后

mcpIdeServerPromptTitle=允许NORINCO Code Agent使用 JetBrains IDE 工具吗？
mcpIdeServerPromptMessage=此 IDE 内置的 MCP 服务器可提供代码导航、检查、重构、运行配置和调试器等原生工具。NORINCO Code Agent可以自动启用并连接它；每次工具调用仍需您的批准。
mcpIdeServerConnectButton=连接
mcpIdeServerDontAskButton=不再询问
mcpIdeServerConnectedTitle=IDE 工具已连接
mcpIdeServerConnectedMessage=IDE 内置 MCP 服务器已作为“{0}”连接到NORINCO Code Agent。您可以在 MCP 服务器设置中管理它。
mcpIdeServerAutoConnectedMessage=IDE 内置 MCP 服务器已启用，并作为“{0}”自动连接到NORINCO Code Agent。工具调用仍需您的批准。
mcpIdeServerDisconnectButton=断开连接
mcpIdeServerUntrusted=项目尚未受信任；信任项目之前，NORINCO Code Agent将保持禁用
mcpIdeServerFailedTitle=无法连接 IDE 工具
mcpIdeServerFailedMessage=NORINCO Code Agent无法连接 IDE 内置的 MCP 服务器：{0}

